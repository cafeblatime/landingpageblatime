<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Session</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
    .card { background: #1e1e1e; border-radius: 16px; padding: 24px; max-width: 360px; margin: 30px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .badge { background: #2e7d32; color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; display: inline-block; margin-bottom: 16px; }
    h1 { font-size: 1.4rem; margin-bottom: 12px; margin-top: 0; }
    .timer-section { background: #282828; border-radius: 12px; padding: 12px; margin-bottom: 16px; }
    .timer-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #aaa; margin-bottom: 4px; }
    .main-timer { font-size: 3rem; font-weight: bold; color: #4CAF50; }
    .buffer-timer { font-size: 1.8rem; font-weight: bold; color: #64B5F6; }
    .warning { color: #FF9800 !important; }
    .expired { color: #E53935 !important; }
    .btn { background: #007AFF; color: #fff; border: none; padding: 14px 20px; font-size: 1rem; font-weight: 600; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn-renew { background: #FF9800; display: none; margin-top: 15px; }
    .btn-leave { background: #E53935; display: block; margin-top: 15px; }
    .status { font-size: 0.85rem; color: #aaa; margin-top: 12px; }
  </style>
</head>
<body>

  <div id="appCard" class="card">
    <div class="badge">✓ Thank you! Finalize your payment by the counter</div>

    <div class="timer-section">
      <div class="timer-label">Cashier Walk Buffer</div>
      <div id="bufferTimer" class="buffer-timer">02:00</div>
    </div>

    <h1 id="tableTitle">TABLE FOCUS SESSION</h1>
    
    <div class="timer-section">
      <div class="timer-label">Focus Session</div>
      <div id="mainTimer" class="main-timer">45:00</div>
    </div>

    <button id="notifyBtn" class="btn" onclick="enablePushNotifications()">🔔 Enable 7-Min Expiry Alert</button>
    
    <!-- RENEWAL BUTTON -->
    <button id="renewBtn" class="btn btn-renew" onclick="startRenewal()">🔄 Renew Focus Session</button>

    <!-- EARLY EXIT / LEAVE BUTTON -->
    <button id="leaveBtn" class="btn btn-leave" onclick="clearTableEarly()">🚪 I'm Leaving / Clear Table</button>

    <div id="statusText" class="status">No personal data required.</div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2MY_qM4p18RYNwn0a8DX_FGQMdMNyJ4q6b8TnZSnVscOGiUIIPjh0xRaZFvZleMh0Mw/exec";
    
    let rawTable = '1';
    let wakeLock = null;

    // Screen Wake Lock Handler to wake or keep screen active
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log('Screen Wake Lock active');
        }
      } catch (err) {
        console.error(`Wake Lock error: ${err.name}, ${err.message}`);
      }
    }

    // Built-in Web Audio Synthesizer Chimes (No files required)
    function playChime(type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        
        function tone(freq, startTime, duration) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          
          gain.gain.setValueAtTime(0.2, ctx.currentTime + startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          osc.start(ctx.currentTime + startTime);
          osc.stop(ctx.currentTime + startTime + duration);
        }

        if (type === '7min') {
          tone(523.25, 0, 0.9);
        } else if (type === 'expired') {
          tone(523.25, 0, 0.4);
          tone(659.25, 0.45, 0.8);
        }
      } catch (e) {
        console.log('Audio playback blocked or unsupported', e);
      }
    }

    try {
      const urlParams = new URLSearchParams(window.location.search);
      rawTable = urlParams.get('table') || urlParams.get('Table') || '1';
      rawTable = rawTable.replace(/[^0-9]/g, '') || '1';
      
      const sessionId = urlParams.get('t') || urlParams.get('submission_id') || 'latest';

      document.getElementById('tableTitle').innerText = "Table " + rawTable + " Focus Session";

      const storageKey = 'session_start_table_' + rawTable + '_' + sessionId;
      let startTime = localStorage.getItem(storageKey);

      // --- TIMER ENGINE DURATIONS ---
      const BUFFER_DURATION_MS = 2 * 60 * 1000;   // 2 min buffer
      const MAIN_DURATION_MS = 45 * 60 * 1000;  // 45 min session
      const TOTAL_DURATION_MS = BUFFER_DURATION_MS + MAIN_DURATION_MS;

      if (!startTime) {
        startTime = Date.now();
        localStorage.setItem(storageKey, startTime);
      } else {
        startTime = parseInt(startTime, 10);
      }

      // Save active table session and calculated absolute expiry timestamp for browser persistence/recovery
      const sessionExpiryTime = startTime + TOTAL_DURATION_MS;
      localStorage.setItem('activeTable', rawTable);
      localStorage.setItem('sessionExpiry', sessionExpiryTime);

      if (localStorage.getItem('alerts_enabled_table_' + rawTable + '_' + sessionId) === 'true') {
        const btn = document.getElementById('notifyBtn');
        const status = document.getElementById('statusText');
        if (btn) {
          btn.innerText = "✓ Alerts Enabled";
          btn.style.background = "#34C759";
          btn.disabled = true;
          if (status) status.innerText = "You will receive an alert 7 minutes before expiry.";
        }
      }

      const bufferTimerEl = document.getElementById('bufferTimer');
      const mainTimerEl = document.getElementById('mainTimer');
      const renewBtnEl = document.getElementById('renewBtn');
      let alertPlayed = false;
      let expiredPlayed = false;

      const interval = setInterval(() => {
        const elapsedMs = Date.now() - startTime;

        if (elapsedMs < BUFFER_DURATION_MS) {
          let remainingBufferMs = BUFFER_DURATION_MS - elapsedMs;
          let bufferSecs = Math.floor(remainingBufferMs / 1000);
          let bMins = Math.floor(bufferSecs / 60);
          let bSecs = bufferSecs % 60;

          bufferTimerEl.innerText = `${bMins < 10 ? '0' : ''}${bMins}:${bSecs < 10 ? '0' : ''}${bSecs}`;
          bufferTimerEl.classList.add('warning');
          mainTimerEl.innerText = "45:00";
        } 
        else if (elapsedMs < TOTAL_DURATION_MS) {
          bufferTimerEl.innerText = "00:00";
          bufferTimerEl.classList.remove('warning');
          bufferTimerEl.classList.add('expired');

          let remainingMainMs = TOTAL_DURATION_MS - elapsedMs;
          let mainSecs = Math.floor(remainingMainMs / 1000);
          let mMins = Math.floor(mainSecs / 60);
          let mSecs = mainSecs % 60;

          mainTimerEl.innerText = `${mMins}:${mSecs < 10 ? '0' : ''}${mSecs}`;

          // 7 minutes remaining mark (420 seconds)
          if (mainSecs <= 420 && !alertPlayed) {
            mainTimerEl.classList.add('warning');
            playChime('7min');
            requestWakeLock();
            alertPlayed = true;
          }
        } 
        else {
          bufferTimerEl.innerText = "00:00";
          mainTimerEl.innerText = "0:00";
          mainTimerEl.classList.remove('warning');
          mainTimerEl.classList.add('expired');
          
          if (!expiredPlayed) {
            playChime('expired');
            requestWakeLock();
            expiredPlayed = true;
          }

          if (renewBtnEl) renewBtnEl.style.display = "block";
          
          clearInterval(interval);
        }
      }, 1000);

    } catch (err) {
      console.error("Initialization Error:", err);
    }

    async function enablePushNotifications() {
      const btn = document.getElementById('notifyBtn');
      const status = document.getElementById('statusText');

      requestWakeLock();

      if (!('Notification' in window)) {
        status.innerText = "Push alerts not supported. Keep tab open for chime.";
        return;
      }

      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          const urlParams = new URLSearchParams(window.location.search);
          const sessionId = urlParams.get('t') || urlParams.get('submission_id') || 'latest';
          const tempToken = 'TOKEN_' + Math.random().toString(36).substring(2, 10) + Date.now();

          fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ table: rawTable, token: tempToken })
          });

          localStorage.setItem('alerts_enabled_table_' + rawTable + '_' + sessionId, 'true');

          btn.innerText = "✓ Alerts Enabled";
          btn.style.background = "#34C759";
          btn.disabled = true;
          status.innerText = "You will receive an alert 7 minutes before expiry.";
        } else {
          status.innerText = "Permission denied. Keep tab open to track clock.";
        }
      } catch (err) {
        status.innerText = "Could not enable alerts. Keep tab open for chime.";
      }
    }

    function startRenewal() {
      window.location.href = "https://tally.so/r/aQqkWX?table=" + rawTable;
    }

    async function clearTableEarly() {
      var tableNum = localStorage.getItem('activeTable') || rawTable;
      
      try {
        let response = await fetch(`${SCRIPT_URL}?action=clear&table=${tableNum}`);
        let result = await response.json();
        
        if (result.status === "success") {
          localStorage.removeItem('activeTable');
          localStorage.removeItem('sessionExpiry');
          
          // Display proper professional completion message and close/attempt close
          document.getElementById('appCard').innerHTML = `
            <div style="font-size: 1.3rem; font-weight: bold; margin-bottom: 12px; color: #4CAF50;">Session is ended, thank you!</div>
            <p style="color: #aaa; font-size: 0.9rem;">You may now safely close this window.</p>
          `;

          setTimeout(() => {
            window.close();
          }, 2500);
        } else {
          alert("Could not clear table automatically. Please notify the counter.");
        }
      } catch (err) {
        console.error("Failed to clear table", err);
        // Fallback local cleanup and UI display if CORS or network blips occur
        localStorage.removeItem('activeTable');
        localStorage.removeItem('sessionExpiry');
        document.getElementById('appCard').innerHTML = `
          <div style="font-size: 1.3rem; font-weight: bold; margin-bottom: 12px; color: #4CAF50;">Session is ended, thank you!</div>
          <p style="color: #aaa; font-size: 0.9rem;">You may now safely close this window.</p>
        `;
        setTimeout(() => {
          window.close();
        }, 2500);
      }
    }
  </script>
</body>
</html>
