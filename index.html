<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager Live Dashboard - Demo Mode</title>
  <style>
    :root {
      --bg-color: #1800ad;
      --card-open: #FAF9F6;
      --card-active: #2E7D32;      /* Green */
      --card-expiring: #E65100;    /* Orange */
      --card-expired: #D32F2F;     /* Red */
      --text-main: #1800ad;
      --text-muted: #5A6B82;
      --accent-green: #2E7D32;
      --accent-red: #D32F2F;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      margin: 0;
    }

    h1 { font-size: 1.5rem; text-align: center; margin-bottom: 20px; color: #FAF9F6; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
      max-width: 900px;
      margin: 0 auto;
    }

    .table-card {
      background: var(--card-open);
      border-radius: 14px;
      padding: 18px 16px;
      text-align: center;
      border: 2px solid transparent;
      transition: transform 0.1s ease, background 0.3s ease;
      position: relative;
    }

    /* Only clickable if not open */
    .table-card.clickable {
      cursor: pointer;
    }
    .table-card.clickable:active { 
      transform: scale(0.96); 
    }

    /* STATE CARD STYLES */
    .table-card.state-open { background: var(--card-open); border-color: #E2E8F0; opacity: 0.6; cursor: default; }
    .table-card.state-active { background: var(--card-active); border-color: #2E7D32; opacity: 1; color: #FFFFFF; }
    .table-card.state-expiring { background: var(--card-expiring); border-color: #E65100; opacity: 1; color: #FFFFFF; }
    .table-card.state-expired { background: var(--card-expired); border-color: #D32F2F; opacity: 1; color: #FFFFFF; }

    .table-card.state-active .table-num,
    .table-card.state-expiring .table-num,
    .table-card.state-expired .table-num {
      color: #FFFFFF;
    }

    .table-card.state-active .timer-display,
    .table-card.state-expiring .timer-display,
    .table-card.state-expired .timer-display {
      color: #FFEB3B;
    }

    .table-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .table-num { font-size: 1.4rem; font-weight: 800; color: var(--text-main); }
    
    .bill-emoji {
      font-size: 1.2rem;
      transition: filter 0.3s ease, opacity 0.3s ease;
    }
    .bill-faded { opacity: 0.3; filter: grayscale(100%); }
    .bill-approved { opacity: 1; filter: drop-shadow(0 0 4px #2E7D32); }
    
    .timer-display { 
      font-size: 1.15rem; 
      margin-top: 12px; 
      color: var(--text-muted); 
      font-weight: bold; 
      font-family: monospace;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      align-items: center; justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      background: #FAF9F6;
      color: #1800ad;
      padding: 24px;
      border-radius: 16px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .btn-action {
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      width: 100%;
      margin-top: 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn-pay { background: #2E7D32; color: #FFFFFF; }
    .btn-pay.approved { background: #E2E8F0; color: var(--text-muted); }
    .btn-close { background: #E2E8F0; color: #1800ad; }

    .verify-badge {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 8px;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }
    .verified { background: #2E7D32; color: #FFFFFF; }
    .unverified { background: #D32F2F; color: #FFFFFF; }

    /* PIN Overlay Styles */
    #pinOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-color);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .pin-box {
      background: #FAF9F6;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      max-width: 300px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .pin-input {
      font-size: 1.8rem;
      letter-spacing: 8px;
      text-align: center;
      width: 80%;
      padding: 10px;
      background: #FFFFFF;
      border: 2px solid #E2E8F0;
      color: #1800ad;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .pin-error {
      color: #D32F2F;
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- PIN CODE OVERLAY -->
  <div id="pinOverlay">
    <div class="pin-box">
      <h2 style="margin-top:0; color:#1800ad; font-size: 1.2rem;">Manager Access</h2>
      <p style="color:var(--text-muted); font-size:0.9rem;">Enter 4-digit PIN code:</p>
      <input type="password" id="pinInput" maxlength="4" class="pin-input" pattern="\d*" inputmode="numeric">
      <div id="pinError" class="pin-error">Incorrect PIN. Try again.</div>
      <button class="btn-action btn-pay" onclick="verifyPin()" style="margin-top:8px;">Enter</button>
    </div>
  </div>

  <h1>📱 Counter Dashboard (Demo Mode)</h1>
  <div id="tableGrid" class="grid">Loading demo data...</div>

  <!-- DETAILS MODAL -->
  <div id="detailsModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle" style="margin-top:0;">Table X</h2>
      <hr style="border-color: #E2E8F0;">
      
      <p><strong>Order Summary:</strong></p>
      <ul id="modalOrders" style="padding-left: 20px; color: var(--text-muted); font-size: 0.95rem;"></ul>

      <p><strong>Total Sum:</strong> $<span id="modalTotal">0.00</span></p>
      
      <div id="modalVerify" class="verify-badge">Checking...</div>

      <button id="markPaidBtn" class="btn-action btn-pay" onclick="togglePaymentStatus()">Mark as Paid</button>
      <button class="btn-action btn-close" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURATION AREA
    // ==========================================
    const MANAGER_PIN = "0070"; 
    // ==========================================

    let activeData = {};
    let currentSelectedTable = null;

    window.addEventListener('DOMContentLoaded', () => {
      const pinInput = document.getElementById('pinInput');
      pinInput.focus();
      pinInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') verifyPin();
      });
    });

    function verifyPin() {
      const enteredPin = document.getElementById('pinInput').value;
      const errorEl = document.getElementById('pinError');

      if (enteredPin === MANAGER_PIN) {
        document.getElementById('pinOverlay').style.display = 'none';
        loadDemoData(); 
        setInterval(updateDemoTimers, 1000);
      } else {
        errorEl.style.display = 'block';
        document.getElementById('pinInput').value = '';
      }
    }

    function loadDemoData() {
      activeData = {
        "1": { table: 1, status: "Active", secondsLeft: 1250, orders: ["1x Espresso", "1x Croissant", "Focus Pass (45 minutes)"], totalSum: 14.50, intervalCount: 1, isPaid: false },
        "2": { table: 2, status: "Open", secondsLeft: 0, orders: [], totalSum: 0.00, intervalCount: 0, isPaid: false },
        "3": { table: 3, status: "Expiring", secondsLeft: 180, orders: ["2x Cappuccino", "1x Cheesecake", "Focus Pass (45 minutes)"], totalSum: 26.00, intervalCount: 1, isPaid: true },
        "4": { table: 4, status: "Expired", secondsLeft: 0, orders: ["1x Latte", "Focus Pass (45 minutes)"], totalSum: 10.50, intervalCount: 1, isPaid: false },
        "5": { table: 5, status: "Active", secondsLeft: 2400, orders: ["1x Mocha", "Focus Pass (45 minutes)"], totalSum: 12.00, intervalCount: 1, isPaid: false }
      };
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('tableGrid');
      grid.innerHTML = '';

      const sortedKeys = Object.keys(activeData).sort((a, b) => parseInt(a) - parseInt(b));

      sortedKeys.forEach(tNum => {
        const t = activeData[tNum];
        const statusLower = t.status.toLowerCase();

        const card = document.createElement('div');
        const isOpen = statusLower === 'open';
        
        card.className = `table-card state-${statusLower} ${isOpen ? '' : 'clickable'}`;
        
        if (!isOpen) {
          card.onclick = () => openModal(tNum);
        }

        const isPaid = t.isPaid;
        const billClass = isPaid ? 'bill-approved' : 'bill-faded';
        const showBillEmoji = !isOpen;

        let timerText = "--:--";
        if (isOpen) {
          timerText = "Available";
        } else if (statusLower === 'expired') {
          timerText = "00:00";
        } else {
          const mins = Math.floor(t.secondsLeft / 60);
          const secs = t.secondsLeft % 60;
          timerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        card.innerHTML = `
          <div class="table-header">
            <span class="table-num">Table ${t.table}</span>
            ${showBillEmoji ? `<span class="bill-emoji ${billClass}">💵</span>` : ''}
          </div>
          <div class="timer-display" id="timer-${tNum}">${timerText}</div>
        `;

        grid.appendChild(card);
      });
    }

    function updateDemoTimers() {
      Object.keys(activeData).forEach(tNum => {
        const t = activeData[tNum];
        if (t.status.toLowerCase() === 'active' || t.status.toLowerCase() === 'expiring') {
          if (t.secondsLeft > 0) {
            t.secondsLeft--;
            if (t.secondsLeft <= 300 && t.status.toLowerCase() === 'active') {
              t.status = 'Expiring';
            }
          } else {
            t.status = 'Expired';
          }
        }
      });
      renderGrid();
    }

    function openModal(tNum) {
      currentSelectedTable = tNum;
      const t = activeData[tNum];
      if (!t) return;

      document.getElementById('modalTitle').innerText = `Table ${t.table} Details`;
      
      const ordersList = document.getElementById('modalOrders');
      ordersList.innerHTML = t.orders.length > 0 
        ? t.orders.map(item => `<li>${item}</li>`).join('')
        : '<li>No items recorded</li>';

      document.getElementById('modalTotal').innerText = t.totalSum.toFixed(2);

      const verifyEl = document.getElementById('modalVerify');
      if (t.intervalCount) {
        verifyEl.innerText = "Focus time is on";
        verifyEl.className = "verify-badge verified";
      } else {
        verifyEl.innerText = "Focus time is off";
        verifyEl.className = "verify-badge unverified";
      }

      updateModalPaidBtn();
      document.getElementById('detailsModal').style.display = 'flex';
    }

    function updateModalPaidBtn() {
      const btn = document.getElementById('markPaidBtn');
      if (!currentSelectedTable || !activeData[currentSelectedTable]) return;

      const isPaid = activeData[currentSelectedTable].isPaid;
      if (isPaid) {
        btn.innerText = "✓ Paid & Approved";
        btn.className = "btn-action btn-pay approved";
      } else {
        btn.innerText = "Mark as Paid";
        btn.className = "btn-action btn-pay";
      }
    }

    function togglePaymentStatus() {
      if (!currentSelectedTable || !activeData[currentSelectedTable]) return;

      activeData[currentSelectedTable].isPaid = !activeData[currentSelectedTable].isPaid;
      updateModalPaidBtn();
      renderGrid();
    }

    function closeModal() {
      document.getElementById('detailsModal').style.display = 'none';
      currentSelectedTable = null;
    }
  </script>
</body>
</html>
