<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Timer Dashboard</title>
  <style>
    :root { --bg-color: #1800ad; --card-bg: #FAF9F6; --text-main: #1800ad; --text-muted: #5A6B82; --accent-red: #D32F2F; }
    body { font-family: system-ui, sans-serif; background: var(--bg-color); color: var(--text-main); padding: 16px; margin: 0; }
    .dashboard { background: var(--card-bg); border-radius: 20px; padding: 24px; max-width: 400px; margin: 0 auto; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .timer { font-size: 3rem; font-weight: bold; font-family: monospace; margin: 20px 0; color: #1800ad; }
    .phase-badge { background: #E2E8F0; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; display: inline-block; margin-bottom: 10px; }
    .btn-end { background: var(--accent-red); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
  </style>
</head>
<body>

<div class="dashboard">
  <span id="phaseBadge" class="phase-badge">Syncing Timer...</span>
  <h1 id="tableDisplay">Table --</h1>
  <div class="timer" id="timerDisplay">47:00</div>
  <p id="subText" style="color: var(--text-muted);">Syncing with counter...</p>
  <button class="btn-end" onclick="confirmClearTable()">End Session</button>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxjQtbuew_onZqKqSEO49KeMQwIwm-t5VBwwSC1l8XcBE-7bWcjcnUDS4Jv9lNHgC2HbQ/exec";
  
  const urlParams = new URLSearchParams(window.location.search);
  const rawTable = urlParams.get("table") || "1";
  const localUserId = localStorage.getItem("focus_user_id") || "USR-GUEST";

  let targetEndTimestampMs = Date.now() + (47 * 60 * 1000); 

  document.getElementById("tableDisplay").innerText = `Table ${rawTable}`;

  async function fetchServerTimerSync() {
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=client&table=${rawTable}&client=${localUserId}`);
      const data = await res.json();

      if (data.status === "success" && data.table) {
        const tableData = data.table;

        if (tableData.status === "Open" || tableData.status === "Cleared") {
          renderExpiredUI();
          return;
        }

        if (tableData.endTime) {
          const parsedMs = new Date(tableData.endTime).getTime();
          if (!isNaN(parsedMs)) {
            targetEndTimestampMs = parsedMs;
          }
        }
      }
    } catch (e) {
      console.warn("Sync failed, fallback to local countdown:", e);
    }
  }

  function updateDisplay() {
    const now = Date.now();
    const remainingSec = Math.floor((targetEndTimestampMs - now) / 1000);

    if (remainingSec <= 0) {
      renderExpiredUI();
      return;
    }

    const mins = Math.floor(remainingSec / 60);
    const secs = remainingSec % 60;
    document.getElementById("timerDisplay").innerText = `${mins < 10 ? '0':''}${mins}:${secs < 10 ? '0':''}${secs}`;

    const badge = document.getElementById("phaseBadge");
    const subText = document.getElementById("subText");

    if (remainingSec > 2700) { 
      badge.innerText = "Buffer Walk Phase";
      badge.style.background = "#FFC107";
      subText.innerText = "Please claim your table and order at the counter.";
    } else {
      badge.innerText = "Focus Session Active";
      badge.style.background = "#2E7D32";
      badge.style.color = "#FFFFFF";
      subText.innerText = "Deep work in progress. Enjoy your focus time!";
    }
  }

  function renderExpiredUI() {
    document.getElementById("timerDisplay").innerText = "00:00";
    document.getElementById("phaseBadge").innerText = "Session Ended";
    document.getElementById("phaseBadge").style.background = "#D32F2F";
    document.getElementById("phaseBadge").style.color = "#FFFFFF";
    document.getElementById("subText").innerText = "This table is now available for new reservations.";
  }

  async function confirmClearTable() {
    if (confirm("End your session early and free up this table?")) {
      try {
        await fetch(`${APPS_SCRIPT_URL}?action=clear&table=${rawTable}`);
      } catch (e) {}
      renderExpiredUI();
    }
  }

  fetchServerTimerSync();
  setInterval(fetchServerTimerSync, 10000);
  setInterval(updateDisplay, 1000);
</script>
</body>
</html>
